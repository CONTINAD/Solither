<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dvSkin" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#F0C49E"/>
      <stop offset="1" stop-color="#D89C72"/>
    </radialGradient>
    <linearGradient id="dvHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4029"/>
      <stop offset="1" stop-color="#33231512"/>
      <stop offset="1" stop-color="#322114"/>
    </linearGradient>
    <linearGradient id="dvHoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262E"/>
      <stop offset="1" stop-color="#15151B"/>
    </linearGradient>
  </defs>

  <!-- hoodie / shoulders -->
  <path d="M28 200 C30 168 56 150 100 150 C144 150 170 168 172 200 Z" fill="url(#dvHoodie)"/>
  <path d="M84 150 q16 18 32 0 l0 14 q-16 12 -32 0 Z" fill="#E6AE83"/>

  <!-- ears + earbuds -->
  <ellipse cx="50" cy="104" rx="11" ry="15" fill="url(#dvSkin)"/>
  <ellipse cx="150" cy="104" rx="11" ry="15" fill="url(#dvSkin)"/>
  <!-- white earbud cables -->
  <path d="M49 112 C40 132 44 156 40 184" stroke="#F4F4F6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M151 112 C160 132 156 156 160 184" stroke="#F4F4F6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="49" cy="106" rx="6.5" ry="8" fill="#FAFAFC" stroke="#CBCBD2" stroke-width="1.5"/>
  <ellipse cx="151" cy="106" rx="6.5" ry="8" fill="#FAFAFC" stroke="#CBCBD2" stroke-width="1.5"/>

  <!-- face -->
  <path d="M56 96 C54 70 72 56 100 56 C128 56 146 70 144 96 C144 124 130 152 100 154 C70 152 56 124 56 96 Z" fill="url(#dvSkin)"/>
  <!-- cheek warmth -->
  <ellipse cx="74" cy="116" rx="10" ry="6" fill="#E89A78" opacity="0.45"/>
  <ellipse cx="126" cy="116" rx="10" ry="6" fill="#E89A78" opacity="0.45"/>

  <!-- curly hair: base + curl clusters -->
  <path d="M52 98 C44 60 64 36 100 36 C136 36 156 60 148 98 C150 80 140 66 128 64 C140 58 120 48 100 50 C80 48 60 58 72 64 C60 66 50 80 52 98 Z" fill="url(#dvHair)"/>
  <g fill="#3E2A18">
    <circle cx="66" cy="52" r="13"/><circle cx="84" cy="42" r="14"/><circle cx="100" cy="39" r="14"/>
    <circle cx="116" cy="42" r="14"/><circle cx="134" cy="52" r="13"/><circle cx="142" cy="68" r="12"/>
    <circle cx="58" cy="68" r="12"/><circle cx="74" cy="50" r="10"/><circle cx="126" cy="50" r="10"/>
    <circle cx="50" cy="84" r="9"/><circle cx="150" cy="84" r="9"/>
  </g>
  <g fill="#5C422A" opacity="0.85">
    <circle cx="80" cy="44" r="6"/><circle cx="104" cy="40" r="6"/><circle cx="128" cy="48" r="5"/>
  </g>

  <!-- eyebrows -->
  <path d="M70 92 q14 -9 28 -2" stroke="#3A2817" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M102 90 q14 -7 28 2" stroke="#3A2817" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="82" cy="104" rx="8.5" ry="7" fill="#fff"/>
  <ellipse cx="118" cy="104" rx="8.5" ry="7" fill="#fff"/>
  <circle cx="84" cy="105" r="4.2" fill="#3A2A1C"/>
  <circle cx="116" cy="105" r="4.2" fill="#3A2A1C"/>
  <circle cx="85.5" cy="103.5" r="1.4" fill="#fff"/>
  <circle cx="117.5" cy="103.5" r="1.4" fill="#fff"/>

  <!-- nose -->
  <path d="M100 110 q-6 12 -2 16 q4 3 8 0" fill="none" stroke="#C98B63" stroke-width="3" stroke-linecap="round"/>

  <!-- mustache -->
  <path d="M78 132 q10 -7 22 -2 q12 -5 22 2 q-10 10 -22 6 q-12 4 -22 -6 Z" fill="#41301E"/>
  <!-- mouth -->
  <path d="M86 142 q14 8 28 0" stroke="#9B5A45" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- soul patch -->
  <path d="M94 148 q6 6 12 0 q-2 9 -6 10 q-4 -1 -6 -10 Z" fill="#41301E"/>
</svg>
