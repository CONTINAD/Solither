<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14F195"/>
      <stop offset="0.5" stop-color="#3FB6E8"/>
      <stop offset="1" stop-color="#9945FF"/>
    </linearGradient>
    <radialGradient id="glowP" cx="18%" cy="16%" r="55%">
      <stop offset="0" stop-color="#9945FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="84%" cy="88%" r="55%">
      <stop offset="0" stop-color="#14F195" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1920" height="1080" fill="#07060d"/>
  <rect width="1920" height="1080" fill="url(#glowP)"/>
  <rect width="1920" height="1080" fill="url(#glowG)"/>

  <!-- LIVE pill -->
  <g transform="translate(960,86)">
    <rect x="-92" y="-26" width="184" height="52" rx="26" fill="#FF4D6D" fill-opacity="0.16" stroke="#FF4D6D" stroke-opacity="0.6"/>
    <circle cx="-52" cy="0" r="9" fill="#FF4D6D"/>
    <text x="14" y="9" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="4" fill="#FF8094">LIVE</text>
  </g>

  <!-- title -->
  <text x="960" y="232" text-anchor="middle" font-weight="700" font-size="150" letter-spacing="6">
    <tspan fill="#ffffff">SOL</tspan><tspan fill="url(#brand)">ITHER</tspan>
  </text>
  <text x="960" y="296" text-anchor="middle" font-weight="500" font-size="38" letter-spacing="12" fill="#cfc8e6">SOL + SLITHER &#183; ON-CHAIN SNAKE ARENA</text>
  <rect x="780" y="330" width="360" height="4" rx="2" fill="url(#brand)"/>

  <!-- 4 step cards -->
  <g transform="translate(100,396)">
    <!-- card 1 -->
    <g transform="translate(0,0)">
      <rect width="400" height="372" rx="26" fill="url(#card)" stroke="#9945FF" stroke-opacity="0.35"/>
      <text x="36" y="120" font-size="110" font-weight="700" fill="url(#brand)" opacity="0.85">1</text>
      <text x="36" y="186" font-size="44" font-weight="700" fill="#ffffff">HOLD</text>
      <text x="36" y="246" font-size="29" fill="#bdb6d6"><tspan x="36" dy="0">Hold </tspan><tspan fill="#14F195" font-weight="700">250,000</tspan></text>
      <text x="36" y="286" font-size="29" fill="#bdb6d6">$SOLITHER in your</text>
      <text x="36" y="326" font-size="29" fill="#bdb6d6">wallet to unlock play.</text>
    </g>
    <!-- card 2 -->
    <g transform="translate(440,0)">
      <rect width="400" height="372" rx="26" fill="url(#card)" stroke="#9945FF" stroke-opacity="0.35"/>
      <text x="36" y="120" font-size="110" font-weight="700" fill="url(#brand)" opacity="0.85">2</text>
      <text x="36" y="186" font-size="44" font-weight="700" fill="#ffffff">PLAY</text>
      <text x="36" y="246" font-size="29" fill="#bdb6d6">Grow the longest</text>
      <text x="36" y="286" font-size="29" fill="#bdb6d6">snake. Eat orbs, cut</text>
      <text x="36" y="326" font-size="29" fill="#bdb6d6">off rivals, survive.</text>
    </g>
    <!-- card 3 -->
    <g transform="translate(880,0)">
      <rect width="400" height="372" rx="26" fill="url(#card)" stroke="#14F195" stroke-opacity="0.4"/>
      <text x="36" y="120" font-size="110" font-weight="700" fill="url(#brand)" opacity="0.85">3</text>
      <text x="36" y="186" font-size="44" font-weight="700" fill="#ffffff">WIN</text>
      <text x="36" y="246" font-size="29" fill="#bdb6d6">Every round the</text>
      <text x="36" y="286" font-size="29" fill="#bdb6d6"><tspan fill="#14F195" font-weight="700">top 5</tspan> split REAL</text>
      <text x="36" y="326" font-size="29" fill="#bdb6d6">creator fees.</text>
    </g>
    <!-- card 4 -->
    <g transform="translate(1320,0)">
      <rect width="400" height="372" rx="26" fill="url(#card)" stroke="#14F195" stroke-opacity="0.4"/>
      <text x="36" y="120" font-size="110" font-weight="700" fill="url(#brand)" opacity="0.85">4</text>
      <text x="36" y="186" font-size="44" font-weight="700" fill="#ffffff">PAID</text>
      <text x="36" y="246" font-size="29" fill="#bdb6d6">SOL sent straight to</text>
      <text x="36" y="286" font-size="29" fill="#bdb6d6">your wallet &#8212;</text>
      <text x="36" y="326" font-size="29" fill="#bdb6d6">on-chain, automatic.</text>
    </g>
  </g>

  <!-- reward strip -->
  <g transform="translate(960,876)">
    <rect x="-620" y="-44" width="1240" height="88" rx="44" fill="#14F195" fill-opacity="0.08" stroke="#14F195" stroke-opacity="0.35"/>
    <text x="0" y="11" text-anchor="middle" font-size="36" font-weight="600" fill="#eafff6">Top 5 split creator-fee <tspan fill="#14F195" font-weight="700">SOL</tspan> every round &#183; paid on-chain &#183; verifiable</text>
  </g>

  <!-- footer: CA + URL -->
  <text x="960" y="992" text-anchor="middle" font-size="26" fill="#8b85a6" letter-spacing="1">CA</text>
  <text x="960" y="1028" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" fill="#d9d3ee">GhrTH8tWDTmodEsatV3WoN3q7YqnG7fHYbr4d4MYpump</text>
  <text x="80" y="1028" font-size="34" font-weight="700" fill="url(#brand)">solither.xyz</text>
</svg>
